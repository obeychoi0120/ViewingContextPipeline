[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "viewing-context-validation"
version = "0.1.0"
description = "Controlled MicroLens/SASRec validation of incremental Viewing Context ranking value."
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pydantic>=2.0", "PyYAML>=6.0"]

[project.optional-dependencies]
train = ["torch>=2.2", "transformers>=4.51"]
test = ["pytest>=8.0"]

[project.scripts]
vc-validation = "vc_validation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
