schema_version: viewing-context-config/v1
protocol:
  dataset: microlens_100k
  modality: visual_only
  sampling: fixed_30s
  graph_extractors: [qwen, gemini]
  graph_summarizer: qwen
  description_model: qwen
  arms: [graph_qwen, graph_gemini, description]
artifacts_root: artifacts
data:
  videos_dir: /home_nvme/shared/data/microlens_100k/MicroLens-100k_videos
  titles_csv: /home_nvme/shared/data/microlens_100k/Annotations/MicroLens-100k_title_en.csv
  tags_csv: /home_nvme/shared/data/microlens_100k/Annotations/tags_to_summary.csv
  pairs_tsv: /home_nvme/shared/data/microlens_100k/Annotations/MicroLens-100k_pairs_1k.tsv
models:
  qwen: /home_nvme/shared/models/Qwen3-VL-2B-Instruct
  bge: /home_nvme/shared/models/bge-large-en-v1.5
  gemini:
    project_id: replace-with-gcp-project-id
    location: global
    model_id: gemini-3.5-flash
extraction:
  visual_evidence:
    image_resolution: [640, 352]
  graph:
    summary_prompt: config/prompts/graph_summary_v1.md
    scene_max_new_tokens: 512
    summary_max_new_tokens: 512
    do_sample: false
    gemini_concurrency: 4
  description:
    scene_prompt: config/prompts/description_scene_v1.md
    summary_prompt: config/prompts/description_summary_v1.md
    scene_max_new_tokens: 512
    summary_max_new_tokens: 512
    do_sample: false
validation:
  cohort:
    user_count: 59
    seed: 42
    min_sequence_length: 5
    max_sequence_length: 13
    history_strata: [5, 10, 20, 50]
  encoder:
    model_id: BAAI/bge-large-en-v1.5
    embedding_dim: 1024
    max_length: 512
    normalize_embeddings: true
    batch_size: 32
  model:
    max_sequence_length: 10
    embedding_dim: 128
    num_blocks: 2
    num_heads: 2
    dropout: 0.1
    batch_size: 128
    max_epochs: 50
    patience: 5
    learning_rate: 0.0001
    seeds: [42, 43, 44]
  evaluation:
    cutoffs: [4, 8, 10, 20]
    primary_cutoff: 10
    bootstrap_samples: 10000
    non_inferiority_margin: 0.05
