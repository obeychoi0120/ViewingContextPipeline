schema_version: viewing-context-config/v2
protocol:
  dataset: microlens_100k
  modality: visual_only
  sampling: fixed_30s
  graph_extractors: [qwen, gemini]
  graph_summarizer: qwen
  description_model: qwen
  arms: [metadata, graph_qwen, graph_gemini, description]
artifacts_root: artifacts
data:
  videos_dir: /home_nvme/shared/data/microlens_100k/MicroLens-100k_videos
  pairs_tsv: /home_nvme/shared/data/microlens_100k/Annotations/MicroLens-100k_pairs_1k.tsv
  titles_csv: /home_nvme/shared/data/microlens_100k/Annotations/MicroLens-100k_title_en.csv
models:
  qwen: /home_nvme/shared/models/Qwen3-VL-2B-Instruct
  bge: /home_nvme/shared/models/bge-large-en-v1.5
  gemini:
    project_id: insight-dev-490002
    location: global
    model_id: gemini-3.7-flash
    temperature: 0.0
    max_output_tokens: 1024
    thinking_level: low
    media_resolution: MEDIA_RESOLUTION_MEDIUM
extraction:
  visual_evidence:
    image_resolution: [640, 352]
  greedy_decoding: true
  summary_repetition_penalty: 1.05
  summary_sampling:
    temperature: 0.2
    top_p: 0.8
    top_k: 20
  graph:
    scene_prompt: config/prompts/graph_scene_v2.md
    summary_prompt: config/prompts/graph_summary_v3.md
    scene_max_new_tokens: 512
    summary_max_new_tokens: 512
    gemini_concurrency: 8
  description:
    scene_prompt: config/prompts/description_scene_v1.md
    summary_prompt: config/prompts/description_summary_v3.md
    scene_max_new_tokens: 512
    summary_max_new_tokens: 512
validation:
  cohort:
    user_count: 59
    seed: 42
    min_sequence_length: 5
    max_sequence_length: 13
    history_strata: [5, 10, 20, 50]
  encoder:
    embedding_dim: 1024
    max_length: 512
    batch_size: 32
  model:
    max_sequence_length: 10
    embedding_dim: 512
    num_blocks: 2
    num_heads: 2
    dropout: 0.1
    batch_size: 256
    max_epochs: 50
    patience: 5
    learning_rate: 0.0001
    popularity_power: 1.0
    seeds: [42, 43, 44]
  evaluation:
    cutoffs: [4, 8, 10, 20]
    primary_cutoff: 10
    bootstrap_samples: 10000
    non_inferiority_margin: 0.05
    familywise_alpha: 0.05
    multiple_comparison_correction: bonferroni
    # Provisional PoC gates: confirm these before interpreting a pilot result.
    min_scene_coverage: 0.95
    max_arm_coverage_gap: 0.05
