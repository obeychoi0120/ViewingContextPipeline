schema_version: viewing-context-config/v5
protocol:
  dataset: microlens_100k
  modality: visual_only
  sampling: fixed_windows
  cohort_sampling: full_rolling
  catalog_scope: full_source_catalog
  graph_extractors:
  - qwen
  - gemini
  graph_summarizer: qwen
  arms:
  - desc_gemini
  - desc_qwen
  - graph_gemini
  - graph_qwen
  - metadata
  description_extractors:
  - qwen
  - gemini
artifacts_root: artifacts
data:
  pairs_csv: /home_nvme/shared/data/microlens_100k/Annotations/MicroLens-100k_pairs.csv
  videos_dir: /home_nvme/shared/data/microlens_100k/MicroLens-100k_videos
  pairs_tsv: /home_nvme/shared/data/microlens_100k/Annotations/MicroLens-100k_pairs.tsv
  titles_csv: /home_nvme/shared/data/microlens_100k/Annotations/MicroLens-100k_title_en_completed.csv
models:
  qwen: /home_nvme/shared/models/Qwen3-VL-2B-Instruct
  bge: /home_nvme/shared/models/bge-large-en-v1.5
  gemini:
    project_id: insight-dev-490002
    location: global
    model_id: gemini-3.8-flash
    temperature: 0.0
    thinking_level: low
    media_resolution: MEDIA_RESOLUTION_LOW
extraction:
  gemini:
    threads: 16
  qwen:
    gpu_memory_utilization: 0.9
    max_num_seqs: 32
    max_num_batched_tokens: 16384
    max_model_len: auto
    renderer_num_workers: 4
    enable_chunked_prefill: true
    enable_prefix_caching: true
    enforce_eager: false
    async_scheduling: null
  visual_evidence:
    image_resolution:
    - 640
    - 352
    scene_duration: 30
    num_keyframes: 6
  greedy_decoding: true
  graph_repetition_penalty:
  - 1.0
  - 1.05
  - 1.1
  - 1.15
  - 1.2
  description_repetition_penalty:
  - 1.0
  - 1.05
  - 1.1
  - 1.15
  - 1.2
  summary_repetition_penalty:
  - 1.0
  - 1.05
  - 1.1
  - 1.15
  - 1.2
  summary_sampling:
    temperature: 0.2
    top_p: 0.8
    top_k: 20
  graph:
    scene_max_new_tokens: 1024
    summary_max_new_tokens: 512
  description:
    scene_max_new_tokens: 1024
    summary_max_new_tokens: 512
validation:
  cohort:
    mode: full_rolling
    metadata_missing_policy: zero_vector
    user_count: 100000
    interaction_count: 719405
    item_count: 19738
    timezone: UTC
    evaluation_days: 7
    exclude_final_day: true
  encoder:
    embedding_dim: 1024
    max_length: 512
    batch_size: 32
  model:
    max_sequence_length: 10
    embedding_dim: 512
    num_blocks: 2
    num_heads: 2
    dropout: 0.1
    batch_size: 256
    max_epochs: 50
    patience: 5
    learning_rate: 0.0001
    popularity_power: 1.0
    seeds:
    - 42
    - 43
    - 44
  evaluation:
    cutoffs:
    - 4
    - 8
    - 10
    - 20
    - 30
    primary_cutoff: 10
    bootstrap_samples: 10000
    familywise_alpha: 0.05
    multiple_comparison_correction: bonferroni
    min_scene_coverage: 0.95
    max_arm_coverage_gap: 0.05
