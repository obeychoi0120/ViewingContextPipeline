[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "viewing-context-pipeline"
version = "0.1.0"
description = "Visual-only MicroLens graph-versus-description pilot pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "av",
  "numpy",
  "opencv-python-headless",
  "Pillow",
  "pydantic>=2",
  "PyYAML",
  "tqdm",
]

[project.optional-dependencies]
qwen = ["accelerate", "torch", "transformers"]
train = ["torch"]
gemini = ["google-genai"]
multimodal = ["faster-whisper", "moviepy", "paddleocr"]
dev = ["pytest", "ruff"]

[tool.setuptools]
py-modules = ["pipeline_runtime"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
